<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Directory</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    #users-list { list-style: none; padding: 0; }
    #users-list li { border: 1px solid #ccc; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
    #users-list p { margin: 0.2rem 0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>

  <button id="load-users" type="button">Load users</button>

  <p>
    <label for="filter-input">Filter by name</label>
    <input type="text" id="filter-input" placeholder="Type a name...">
  </p>

  <p id="status"></p>

  <ul id="users-list"></ul>
</body>
</html>
